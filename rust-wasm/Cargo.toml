[package]
name = "rust-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strum_macros = "0.28.0"
wasm-bindgen = "0.2.128"

[dependencies.web-sys]
version = "0.3.104"
features = ["console"]

[dependencies.console_error_panic_hook]
version = "0.1.7"

[build]
target = "wasm32-unknown-unknown"
